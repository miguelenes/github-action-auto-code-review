name: Publish reviewer engine

on:
	push:
		tags:
			- reviewer-engine-v*

permissions:
	contents: read

jobs:
	publish:
		runs-on: ubuntu-latest
		permissions:
			contents: read
		steps:
			- uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
			- uses: pnpm/action-setup@fe02b34f77f55aaf4e20c0c2e9c558702f5f8b3e # v4.1.0
				with:
					version: 12.14.0
			- uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
				with:
					node-version: 24
					registry-url: https://registry.npmjs.org
			- run: pnpm install --frozen-lockfile
			- run: pnpm check
			- run: pnpm --filter @miguelenes/reviewer-engine publish --access public
				env:
					NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
