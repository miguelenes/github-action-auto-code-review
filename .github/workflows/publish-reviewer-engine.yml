name: Publish reviewer engine release artifact

on:
  push:
    tags:
      - reviewer-engine-v*

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f55aaf4e20c0c2e9c558702f5f8b3e # v4.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build and pack the engine
        run: |
          pnpm --filter @miguelenes/reviewer-engine build
          mkdir -p release
          npm pack ./packages/reviewer-engine --pack-destination release
      - name: Create the versioned GitHub Release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
