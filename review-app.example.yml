# Read from the trusted pull request base commit.
mode: hosted
providers:
  - openrouter
preferredModels: []
# Owner-verified evidence is required to enable a direct provider's exact model.
# Never add trials or paid-credit offers here; direct providers have no request-level cost cap.
verifiedFreeOffers: []
# Optional. OpenRouter only; every entry is an owner attestation for the exact model.
# The live OpenRouter key must have a finite non-resetting cap <= this budget,
# include BYOK spending, report remaining balance, and expire by trialExpiresAt.
verifiedTrialOffers: []
allowedRepositories: []
automaticFixes: false
autoMerge: false
mergeMethod: SQUASH
validationWorkflow: validate-review.yml
validationTimeoutSeconds: 300
validationCommands:
  - pnpm --dir untrusted install --frozen-lockfile --ignore-scripts
  - pnpm --dir untrusted build
  - pnpm --dir untrusted test
